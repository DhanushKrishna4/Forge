[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-ml"
version = "0.1.0"
description = "An inspectable tensor, differentiation, and WebGPU compiler laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy==2.2.6"]

[project.scripts]
forge = "forge_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["reference: independent PyTorch comparison"]
