name: Validate Forge

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: src
  FORGE_BASE: /Forge/

jobs:
  native:
    name: Native numerical and compiler checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run native tests without optional reference dependency
        run: python -m pytest --ignore=tests/test_reference.py -q
      - name: Build installable Python distributions
        run: python -m build
      - name: Verify wheel installation outside the checkout
        run: python scripts/check_wheel.py

  reference:
    name: Independent CPU PyTorch reference
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.12'
          cache: pip
          cache-dependency-path: requirements-reference.txt
      - name: Select the CPU-only PyTorch wheel
        # Preinstall the CPU distribution: Linux's default wheel pulls CUDA.
        # The following locked installation supplies all remaining dependencies.
        run: python -m pip install --no-deps --index-url https://download.pytorch.org/whl/cpu torch==2.8.0
      - name: Install locked reference dependencies
        run: python -m pip install -r requirements-reference.txt
      - name: Require PyTorch and run independent reference checks
        run: |
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          python -m pytest tests/test_reference.py -v -s

  static-build:
    name: Static production build at repository subpath
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.12'
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '26.4.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache pinned browser runtime
        uses: actions/cache@v6
        with:
          path: web/public/pyodide
          key: pyodide-0.27.7-${{ hashFiles('scripts/prepare_assets.py', 'web/public/assets/runtime-manifest.json') }}
      - name: Install native runtime needed to generate conformance fixtures
        run: python -m pip install -r requirements-runtime.txt
      - name: Bundle current Forge source and pinned Pyodide runtime
        run: python scripts/prepare_assets.py --runtime
      - name: Generate small deterministic backend fixtures
        run: python scripts/generate_gpu_fixtures.py
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build static site
        working-directory: web
        run: npm run build
      - name: Preserve reviewable static artifact without publishing
        uses: actions/upload-artifact@v7
        with:
          name: forge-static-build
          path: web/dist
          if-no-files-found: error
          retention-days: 7
